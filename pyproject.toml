[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-broker"
dynamic = ["version"]
description = "MCP execution broker and remote executors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "PyYAML",
    "websockets>=14",
    "textual>=8.2,<9",
]

[project.scripts]
broker = "broker.cli:main"

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]

[tool.setuptools.dynamic]
version = {attr = "broker.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
